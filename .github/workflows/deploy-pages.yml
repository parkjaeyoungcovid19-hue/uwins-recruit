name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages 배포
        uses: actions/deploy-pages@v4
